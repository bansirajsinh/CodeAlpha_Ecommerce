<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your order history — Aethera">
  <title>My Orders — Aethera</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ══ HEADER ════════════════════════════════════════════ -->
  <header class="header">
    <nav class="nav container">
      <a href="/index.html" class="nav-logo">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 22H22L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 6L5 20H19L12 6Z" fill="url(#logo-grad)" opacity="0.15"/>
          <circle cx="12" cy="13" r="3" stroke="url(#logo-grad)" stroke-width="2"/>
          <defs>
            <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6C63FF" />
              <stop offset="100%" stop-color="#FF6584" />
            </linearGradient>
          </defs>
        </svg>
        <span class="nav-logo-text">AETHERA</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links">
          <a href="/index.html" class="nav-link">Home</a>
          <a href="/orders.html" class="nav-link active" aria-current="page">Orders</a>
        </nav>
        <a href="/cart.html" class="cart-btn" id="cart-btn">
          🛒 Cart
          <span class="cart-badge hidden" id="cart-badge"></span>
        </a>
        <div class="user-menu" id="user-menu" style="display:none">
          <div class="user-avatar" id="user-avatar">U</div>
          <span id="user-name" style="font-size:.875rem;font-weight:600"></span>
          <button onclick="auth.logout()" class="btn btn-secondary btn-sm">Logout</button>
        </div>
        <a href="/login.html" class="btn btn-primary btn-sm" id="login-btn">Login</a>
      </div>
    </nav>
  </header>

  <!-- ══ MAIN ══════════════════════════════════════════════ -->
  <main class="page-wrapper">
    <div class="container">

      <div class="section-header">
        <h1 class="section-title">📦 My Orders</h1>
      </div>

      <!-- Orders list (rendered by orders.js) -->
      <div id="orders-container" aria-live="polite"></div>

    </div>
  </main>

  <!-- ══ FOOTER ════════════════════════════════════════════ -->
  <footer class="footer">
    <p>© 2026 <strong>Aethera</strong> · CodeAlpha Internship</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>

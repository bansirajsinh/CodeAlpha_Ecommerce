<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product details — Aethera">
  <title>Product — Aethera</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ══ HEADER ════════════════════════════════════════════ -->
  <header class="header">
    <nav class="nav container">
      <a href="/index.html" class="nav-logo" aria-label="Aethera Home">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 22H22L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 6L5 20H19L12 6Z" fill="url(#logo-grad)" opacity="0.15"/>
          <circle cx="12" cy="13" r="3" stroke="url(#logo-grad)" stroke-width="2"/>
          <defs>
            <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6C63FF" />
              <stop offset="100%" stop-color="#FF6584" />
            </linearGradient>
          </defs>
        </svg>
        <span class="nav-logo-text">AETHERA</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" aria-label="Main navigation">
          <a href="/index.html" class="nav-link">Home</a>
          <a href="/orders.html" class="nav-link">Orders</a>
        </nav>
        <a href="/cart.html" class="cart-btn" id="cart-btn" aria-label="Shopping Cart">
          🛒 Cart
          <span class="cart-badge hidden" id="cart-badge"></span>
        </a>
        <div class="user-menu" id="user-menu" style="display:none">
          <div class="user-avatar" id="user-avatar">U</div>
          <span id="user-name" style="font-size:.875rem;font-weight:600"></span>
          <button onclick="auth.logout()" class="btn btn-secondary btn-sm">Logout</button>
        </div>
        <a href="/login.html" class="btn btn-primary btn-sm" id="login-btn">Login</a>
      </div>
    </nav>
  </header>

  <!-- ══ MAIN ══════════════════════════════════════════════ -->
  <main class="page-wrapper">
    <div class="container">

      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/index.html">Home</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <a href="/index.html" id="bc-category">Products</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <span id="bc-product">Loading…</span>
      </nav>

      <!-- Product Content (two-column grid, filled by product.js) -->
      <div class="product-detail-layout" id="product-container" aria-live="polite">
        <div style="grid-column:1/-1;text-align:center;padding:5rem 0">
          <div class="spin" style="font-size:2.5rem" aria-label="Loading">⏳</div>
        </div>
      </div>

    </div>
  </main>

  <!-- ══ FOOTER ════════════════════════════════════════════ -->
  <footer class="footer">
    <p>© 2026 <strong>Aethera</strong> · CodeAlpha Internship</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
